name: build

on:
  workflow_call:
    inputs:
      ref:
        description: Git ref to build, defaults to the ref that triggered the caller
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: npm --prefix web run build
      # Not "web-dist": artifact names are shared with the calling workflow's run.
      - uses: actions/upload-artifact@v7
        with:
          name: build-web-dist
          path: web/dist
          if-no-files-found: error
          retention-days: 1

  binary:
    needs: web
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # Native runner, so musl-gcc from musl-tools can build the bundled SQLite without
          # a cross toolchain.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: "true"
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # rust-embed needs web/dist to exist at compile time.
      - uses: actions/download-artifact@v8
        with:
          name: build-web-dist
          path: web/dist
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ env.TARGET }}
      - run: cargo build --release --locked --target "$TARGET"
      # The image is FROM scratch, so a dynamically linked binary would not start.
      - name: Check the binary is static
        run: |
          info="$(file "target/$TARGET/release/sysslor")"
          echo "$info"
          if ! grep -Eq 'statically linked|static-pie linked' <<< "$info"; then
            echo "::error::sysslor is not statically linked"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: sysslor-${{ matrix.arch }}-linux-musl
          path: target/${{ env.TARGET }}/release/sysslor
          if-no-files-found: error
          retention-days: 7
