name: image

# Packages the binaries from build.yml, which must have run earlier in the same workflow run.
on:
  workflow_call:
    inputs:
      tags:
        description: Newline-separated image tags to publish, e.g. "dev" or "1.2.3\n1.2\nlatest"
        required: true
        type: string
      ref:
        description: Git ref to build, defaults to the ref that triggered the caller
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  IMAGE: ghcr.io/sebastianljunggren/sysslor

jobs:
  image:
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
      # Laid out by Docker arch name so the Dockerfile can use TARGETARCH.
      - uses: actions/download-artifact@v8
        with:
          name: sysslor-x86_64-linux-musl
          path: dist/amd64
      - uses: actions/download-artifact@v8
        with:
          name: sysslor-aarch64-linux-musl
          path: dist/arm64
      - id: tags
        name: Expand tags
        env:
          TAGS: ${{ inputs.tags }}
        run: |
          refs=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && refs+=("$IMAGE:$tag")
          done <<< "$TAGS"
          if [ ${#refs[@]} -eq 0 ]; then
            echo "::error::no tags given"
            exit 1
          fi
          {
            echo "refs<<EOF"
            printf '%s\n' "${refs[@]}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile only copies files, so both platforms build here without emulation.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.refs }}
          push: true
