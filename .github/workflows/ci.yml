name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # Builds first: the build generates src/lib/paraglide/, which check imports.
      - run: npm --prefix web run build
      - run: npm --prefix web run check
      - run: npm --prefix web test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  rust:
    runs-on: ubuntu-26.04
    # rust-embed needs web/dist to exist at compile time.
    needs: web
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo clippy --all-targets --locked --features demo -- -D warnings
      - run: cargo test --locked --features demo -- demo clock
      - name: Check ts-rs types are up to date
        run: |
          if [ -n "$(git status --porcelain web/src/lib/api)" ]; then
            echo "::error::web/src/lib/api is out of date, run cargo test and commit the result"
            git status --porcelain web/src/lib/api
            git diff web/src/lib/api
            exit 1
          fi

  # The release binaries for both arches, plus the x86_64 demo binary for screenshots below.
  binary:
    needs: web
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          # Native runner, so musl-gcc from musl-tools can build the bundled SQLite without
          # a cross toolchain.
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    env:
      SQLX_OFFLINE: "true"
      TARGET: ${{ matrix.arch }}-unknown-linux-musl
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # rust-embed needs web/dist to exist at compile time.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: web-dist
          path: web/dist
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          targets: ${{ env.TARGET }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          key: ${{ env.TARGET }}
      - run: cargo build --release --locked --target "$TARGET"
      # The image is FROM scratch, so a dynamically linked binary would not start.
      - name: Check the binary is static
        run: |
          info="$(file "target/$TARGET/release/sysslor")"
          echo "$info"
          if ! grep -Eq 'statically linked|static-pie linked' <<< "$info"; then
            echo "::error::sysslor is not statically linked"
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sysslor-${{ matrix.arch }}-linux-musl
          path: target/${{ env.TARGET }}/release/sysslor
          if-no-files-found: error
          retention-days: 7
      # Overwrites target/$TARGET/release/sysslor, so it must come after the upload above.
      # Only sysslor itself recompiles, the dependencies are shared with the release build.
      - if: matrix.arch == 'x86_64'
        run: |
          cargo build --release --locked --features demo --target "$TARGET"
          mkdir demo-bin
          cp "target/$TARGET/release/sysslor" demo-bin/sysslor-demo
      # Must not match sysslor-*-linux-musl, which the assets job attaches to releases.
      - if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: sysslor-demo
          path: demo-bin/sysslor-demo
          if-no-files-found: error
          retention-days: 1

  # Renders docs/screenshots/ for the README. A pinned browser and fonts plus a frozen
  # clock make the output reproducible, so an unchanged UI gives no diff. The demo binary
  # is static and has web/dist embedded, so it runs in the Playwright container as is.
  screenshots:
    runs-on: ubuntu-26.04
    needs: binary
    container:
      # Keep in step with @playwright/test in web/package.json; Renovate bumps both together.
      image: mcr.microsoft.com/playwright:v1.64.1-noble@sha256:7852dc5a7d72f5fe458a597d690f6c42fbc8e9e26ddfa95f8e6ef552558d9bbf
      options: --ipc=host
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      files: ${{ steps.diff.outputs.files }}
      artifact-url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sysslor-demo
          path: demo-bin
      - run: chmod +x demo-bin/sysslor-demo
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # No node-version: the Playwright image's Node is used, this only caches ~/.npm.
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # Only rewrites screenshots that no longer match, so identical renders leave no diff.
      - run: npm --prefix web run screenshots -- --update-snapshots=changed
        env:
          SYSSLOR_BIN: ../demo-bin/sysslor-demo
      - id: diff
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          files="$(git status --porcelain docs/screenshots | awk '{ print $2 }' | xargs -r -n1 basename | paste -sd ' ')"
          if [ -n "$files" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "files=$files" >> "$GITHUB_OUTPUT"
            echo "Changed screenshots: $files" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi
      - id: upload
        if: steps.diff.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: screenshots
          path: docs/screenshots
          if-no-files-found: error
          retention-days: 7

  # Tells the author when a PR changes the screenshots; they are updated after the merge.
  # Fork PRs get a read-only token, so they are skipped.
  screenshots-comment:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-26.04
    needs: screenshots
    permissions:
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      PR: ${{ github.event.pull_request.number }}
      CHANGED: ${{ needs.screenshots.outputs.changed }}
      FILES: ${{ needs.screenshots.outputs.files }}
      ARTIFACT_URL: ${{ needs.screenshots.outputs.artifact-url }}
    steps:
      - run: |
          marker='<!-- sysslor-screenshots -->'
          id="$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -n 1)"
          if [ "$CHANGED" = true ]; then
            body="$marker
          This PR changes the README screenshots: \`${FILES// /\`, \`}\`.

          [Download the new screenshots]($ARTIFACT_URL). After the merge, CI opens a PR that updates them on \`main\`."
          elif [ -n "$id" ]; then
            body="$marker
          This PR no longer changes the README screenshots."
          else
            exit 0
          fi
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

  # Keeps one bot PR with the screenshots for the current main, or closes it when main
  # already matches. Uses the GitHub App's token: CI on PRs opened with GITHUB_TOKEN
  # waits for manual approval.
  screenshots-pr:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    needs: screenshots
    env:
      BRANCH: bot/screenshots
      CHANGED: ${{ needs.screenshots.outputs.changed }}
    steps:
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Pushes as the app too, so the push isn't attributed to GITHUB_TOKEN.
          token: ${{ steps.app-token.outputs.token }}
      - if: needs.screenshots.outputs.changed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: screenshots
          path: docs/screenshots
      - env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          pr="$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')"
          if [ "$CHANGED" != true ]; then
            if [ -n "$pr" ]; then
              gh pr close "$pr" --delete-branch --comment "The screenshots on main are up to date."
            fi
            exit 0
          fi
          user_id="$(gh api "/users/$APP_SLUG%5Bbot%5D" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${user_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add docs/screenshots
          git commit -m 'chore: update screenshots'
          git push --force origin "$BRANCH"
          if [ -z "$pr" ]; then
            gh pr create --head "$BRANCH" --title 'chore: update screenshots' \
              --body "Screenshots rendered from $GITHUB_SHA by CI, for the README."
          fi

  # Runs in this workflow rather than its own, so a release reuses the binaries and image
  # built above instead of building the same commit again.
  release-please:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      major: ${{ steps.release.outputs.major }}
      minor: ${{ steps.release.outputs.minor }}
      patch: ${{ steps.release.outputs.patch }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # The GitHub App's token rather than GITHUB_TOKEN: CI on a release PR opened with
      # GITHUB_TOKEN waits for manual approval.
      - id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The artifacts in this run are built from github.sha. release-please releases an
      # older commit when the release merge's run was pending and replaced by a newer push,
      # and those binaries must not be attached to it.
      - if: steps.release.outputs.release_created == 'true' && steps.release.outputs.sha != github.sha
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
          SHA: ${{ steps.release.outputs.sha }}
        run: |
          echo "::error::$TAG was released from $SHA, but this run built $GITHUB_SHA. Build and upload its binaries and image by hand."
          exit 1

  assets:
    if: needs.release-please.outputs.release_created == 'true'
    needs: [rust, binary, release-please]
    runs-on: ubuntu-26.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: sysslor-*-linux-musl
          path: ${{ runner.temp }}/artifacts
      - name: Upload release assets
        working-directory: ${{ runner.temp }}/artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir ../assets
          for dir in sysslor-*-linux-musl; do
            cp "$dir/sysslor" "../assets/${dir/sysslor-/sysslor-$TAG-}"
          done
          cd ../assets
          chmod 755 sysslor-*
          sha256sum sysslor-* > SHA256SUMS
          gh release upload "$TAG" sysslor-* SHA256SUMS --repo "$GITHUB_REPOSITORY"

  # Builds and smoke tests the image on PRs too, so a broken image fails before the merge.
  # Pushes :dev for every commit on main, and the version tags too when it was released.
  image:
    # release-please is skipped outside main, which would otherwise skip this job too.
    if: ${{ !failure() && !cancelled() }}
    needs: [web, rust, binary, release-please]
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/sebastianljunggren/sysslor
      PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      # Laid out by Docker arch name so the Dockerfile can use TARGETARCH.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sysslor-x86_64-linux-musl
          path: dist/amd64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: sysslor-aarch64-linux-musl
          path: dist/arm64
      - id: tags
        name: Expand tags and labels
        env:
          RELEASED: ${{ needs.release-please.outputs.release_created }}
          MAJOR: ${{ needs.release-please.outputs.major }}
          MINOR: ${{ needs.release-please.outputs.minor }}
          PATCH: ${{ needs.release-please.outputs.patch }}
        run: |
          {
            echo "refs<<EOF"
            echo "$IMAGE:dev"
            if [ "$RELEASED" = true ]; then
              echo "$IMAGE:$MAJOR.$MINOR.$PATCH"
              echo "$IMAGE:$MAJOR.$MINOR"
              echo "$IMAGE:latest"
            fi
            echo "EOF"
            # The Dockerfile sets the static labels, these depend on the commit.
            echo "labels<<EOF"
            echo "org.opencontainers.image.revision=$GITHUB_SHA"
            # :dev isn't a release, so it gets no version rather than a misleading one.
            if [ "$RELEASED" = true ]; then
              echo "org.opencontainers.image.version=$MAJOR.$MINOR.$PATCH"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      # Only the runner's arch, because the docker daemon can't load a multi-platform image.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64
          tags: sysslor:smoke-test
          load: true
      # The image is FROM scratch, so a dependency that needs a shell, /tmp, CA certs or
      # tzdata at runtime only shows up when the binary runs in it.
      - name: Smoke test the image
        run: |
          docker run -d --name sysslor --network host \
            --tmpfs /data:mode=1777 \
            -e SYSSLOR_ADMIN_PASSWORD=smoke-test \
            -e SYSSLOR_COOKIE_KEY="$(openssl rand -base64 48)" \
            sysslor:smoke-test
          # /healthz queries the database, so it also checks that SQLite opened /data.
          for _ in $(seq 30); do
            if curl -fsS http://localhost:8080/healthz; then
              echo "sysslor is healthy"
              exit 0
            fi
            sleep 1
          done
          echo "::error::the image did not answer /healthz within 30 seconds"
          docker logs sysslor
          exit 1
      - if: env.PUBLISH == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The Dockerfile only copies files, so both platforms build here without emulation.
      # On PRs this only checks that the arm64 image builds as well.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.tags.outputs.refs }}
          labels: ${{ steps.tags.outputs.labels }}
          push: ${{ env.PUBLISH == 'true' }}
