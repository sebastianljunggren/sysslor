name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      # Builds first: the build generates src/lib/paraglide/, which check imports.
      - run: npm --prefix web run build
      - run: npm --prefix web run check
      - run: npm --prefix web test
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  rust:
    runs-on: ubuntu-26.04
    # rust-embed needs web/dist to exist at compile time.
    needs: web
    env:
      SQLX_OFFLINE: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - name: Check ts-rs types are up to date
        run: |
          if [ -n "$(git status --porcelain web/src/lib/api)" ]; then
            echo "::error::web/src/lib/api is out of date, run cargo test and commit the result"
            git status --porcelain web/src/lib/api
            git diff web/src/lib/api
            exit 1
          fi

  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [web, rust]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/image.yml
    with:
      tags: dev
